<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Прогон размеров</title>
<style>
  body{margin:0;background:#1b1b1b;color:#eee;font:13px/1.3 system-ui;padding:12px}
  .row{display:flex;gap:14px;align-items:flex-start}
  .item{display:flex;flex-direction:column;gap:6px}
  .frame{transform-origin:top left;border:1px solid #444}
  .lab{font-weight:700}
</style></head><body>
<div class="row" id="row"></div>
<script>
const sizes=[[320,568],[360,640],[375,667],[390,844],[430,932]];
const SCALE=0.5;
const row=document.getElementById('row');
for(const [w,h] of sizes){
  const wrap=document.createElement('div'); wrap.className='item';
  const lab=document.createElement('div'); lab.className='lab'; lab.textContent=w+'×'+h;
  const holder=document.createElement('div');
  holder.style.width=(w*SCALE)+'px'; holder.style.height=(h*SCALE)+'px'; holder.style.overflow='hidden';
  const f=document.createElement('iframe');
  f.src='/'; f.width=w; f.height=h; f.className='frame';
  f.style.transform='scale('+SCALE+')';
  holder.appendChild(f); wrap.appendChild(lab); wrap.appendChild(holder); row.appendChild(wrap);
}
</script></body></html>
